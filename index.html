<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Colección de Vinilos</title>
  <!-- Librería para lectura de códigos de barras -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --primary: #1db954;
      --bg: #121212;
      --card-bg: #181818;
      --text: #ffffff;
      --text-sub: #b3b3b3;
      --accent: #ff9800;
      --danger: #e91e63;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 5px; font-size: 22px; }
    p.subtitle { color: var(--text-sub); margin-top: 0; margin-bottom: 15px; font-size: 13px; }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 500px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    button.secondary {
      background-color: #333;
    }
    select {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid #333;
      padding: 10px;
      border-radius: 20px;
      font-size: 14px;
      width: 100%;
    }
    
    /* Abecedario A-Z */
    .alphabet-nav {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      padding: 8px;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .alphabet-nav button {
      flex: none;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      background-color: #282828;
      color: var(--text);
    }
    .alphabet-nav button.disabled {
      opacity: 0.3;
      cursor: default;
      background-color: transparent;
    }

    #scanner-container {
      width: 100%;
      max-width: 500px;
      display: none;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    
    /* Cuadrícula con imágenes MÁS PEQUEÑAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      font-size: 12px;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      background-color: #282828;
      margin-bottom: 6px;
    }
    .owner-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: rgba(0, 0, 0, 0.85);
      color: var(--accent);
      padding: 2px 5px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: bold;
      border: 1px solid var(--accent);
    }
    .card-title {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--text);
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-detail {
      font-size: 10px;
      color: var(--text-sub);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .card-actions {
      display: flex;
      gap: 4px;
      width: 100%;
      margin-top: 6px;
    }
    .card-actions button {
      padding: 4px 6px;
      font-size: 10px;
      border-radius: 4px;
    }
    .btn-edit { background-color: #333; }
    .btn-delete { background-color: var(--danger); }

    /* Modales */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      width: 85%;
      text-align: left;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-top: 0; text-align: center; }
    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .input-group {
      margin-bottom: 10px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 3px;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #222;
      color: #fff;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h1>🎵 Colección de Vinilos</h1>
  <p class="subtitle">Escanea y organiza tus discos con Discogs</p>

  <div class="controls">
    <div class="btn-group">
      <button id="btn-scan" onclick="startScanner()">📷 Escanear Código</button>
      <button id="btn-stop" class="secondary" onclick="stopScanner()" style="display:none;">Cancelar</button>
    </div>
    <select id="sort-select" onchange="renderCollection()">
      <option value="newest">📅 Ordenar por: Más recientes</option>
      <option value="title">🅰️ Ordenar por: Nombre (Artista/Título)</option>
      <option value="genre">🎸 Ordenar por: Género</option>
      <option value="owner">👤 Ordenar por: Propietario</option>
    </select>
  </div>

  <!-- Navegación Abecedario A-Z -->
  <div id="alphabet-nav" class="alphabet-nav"></div>

  <div id="scanner-container">
    <div id="reader"></div>
  </div>

  <div class="grid" id="album-grid">
    <!-- Colección guardada -->
  </div>

  <!-- Modal para seleccionar Propietario -->
  <div id="owner-modal" class="modal">
    <div class="modal-content" style="text-align: center;">
      <h3>¿De quién es este vinilo?</h3>
      <p id="modal-album-title" style="font-size: 13px; color: var(--text-sub);"></p>
      <div class="modal-buttons">
        <button onclick="saveVinylWithOwner('Mío')">🙋‍♂️ Mío</button>
        <button onclick="saveVinylWithOwner('Padre')">👨‍👦 De mi Padre</button>
        <button onclick="saveVinylWithOwner('Ambos')" class="secondary">🤝 De Ambos</button>
      </div>
    </div>
  </div>

  <!-- Modal para Editar Datos -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h3>Editar Vinilo</h3>
      <div class="input-group">
        <label>Artista - Título:</label>
        <input type="text" id="edit-title">
      </div>
      <div class="input-group">
        <label>Propietario:</label>
        <select id="edit-owner">
          <option value="Mío">Mío</option>
          <option value="Padre">De mi Padre</option>
          <option value="Ambos">De Ambos</option>
        </select>
      </div>
      <div class="input-group">
        <label>Género:</label>
        <input type="text" id="edit-genre">
      </div>
      <div class="input-group">
        <label>Año:</label>
        <input type="text" id="edit-year">
      </div>
      <div class="input-group">
        <label>País:</label>
        <input type="text" id="edit-country">
      </div>
      <div class="input-group">
        <label>Sello Discográfico:</label>
        <input type="text" id="edit-label">
      </div>
      <div class="modal-buttons">
        <button onclick="saveEditedVinyl()">Guardar Cambios</button>
        <button onclick="closeEditModal()" class="secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    let html5QrcodeScanner = null;
    let collection = JSON.parse(localStorage.getItem('my_vinyl_collection')) || [];
    let pendingVinyl = null; 
    let editingIndex = null;

    document.addEventListener("DOMContentLoaded", renderCollection);

    function renderCollection() {
      const grid = document.getElementById('album-grid');
      const sortType = document.getElementById('sort-select').value;
      const alphabetNav = document.getElementById('alphabet-nav');
      
      grid.innerHTML = '';
      alphabetNav.innerHTML = '';

      if (collection.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: #b3b3b3;">No hay vinilos guardados todavía.</p>';
        alphabetNav.style.display = 'none';
        return;
      }

      let sortedCollection = [...collection];

      if (sortType === 'title') {
        sortedCollection.sort((a, b) => a.title.localeCompare(b.title));
        alphabetNav.style.display = 'flex';
        buildAlphabetNav(sortedCollection);
      } else {
        alphabetNav.style.display = 'none';
        if (sortType === 'genre') {
          sortedCollection.sort((a, b) => (a.genre || '').localeCompare(b.genre || ''));
        } else if (sortType === 'owner') {
          sortedCollection.sort((a, b) => (a.owner || '').localeCompare(b.owner || ''));
        }
      }

      const assignedLetters = new Set();

      sortedCollection.forEach((item) => {
        const originalIndex = collection.indexOf(item);
        const card = document.createElement('div');
        card.className = 'card';

        // Asignar ID de la primera letra para el salto directo A-Z
        if (sortType === 'title') {
          const firstLetter = getCleanFirstLetter(item.title);
          if (!assignedLetters.has(firstLetter)) {
            card.id = `letter-${firstLetter}`;
            assignedLetters.add(firstLetter);
          }
        }

        card.innerHTML = `
          <img src="${item.cover || 'https://via.placeholder.com/150?text=Sin+Portada'}" alt="Portada">
          <span class="owner-tag">👤 ${item.owner || 'N/A'}</span>
          <div class="card-title">${item.title}</div>
          <div class="card-detail"><b>Año:</b> ${item.year || 'N/A'}</div>
          <div class="card-detail"><b>País:</b> ${item.country || 'N/A'}</div>
          <div class="card-detail"><b>Sello:</b> ${item.label || 'N/A'}</div>
          <div class="card-detail"><b>Género:</b> ${item.genre || 'N/A'}</div>
          <div class="card-actions">
            <button class="btn-edit" onclick="openEditModal(${originalIndex})">✏️</button>
            <button class="btn-delete" onclick="deleteVinyl(${originalIndex})">🗑️</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function getCleanFirstLetter(str) {
      if (!str) return '#';
      const clean = str.trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const firstChar = clean.charAt(0);
      return (firstChar >= 'A' && firstChar <= 'Z') ? firstChar : '#';
    }

    function buildAlphabetNav(sortedCollection) {
      const alphabetNav = document.getElementById('alphabet-nav');
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#".split("");
      
      const existingLetters = new Set(
        sortedCollection.map(item => getCleanFirstLetter(item.title))
      );

      alphabet.forEach(letter => {
        const btn = document.createElement('button');
        btn.innerText = letter;
        
        if (existingLetters.has(letter)) {
          btn.onclick = () => scrollToLetter(letter);
        } else {
          btn.className = 'disabled';
        }
        alphabetNav.appendChild(btn);
      });
    }

    function scrollToLetter(letter) {
      const element = document.getElementById(`letter-${letter}`);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function startScanner() {
      document.getElementById('scanner-container').style.display = 'block';
      document.getElementById('btn-scan').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'block';

      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { 
        fps: 15,
        qrbox: { width: 300, height: 100 },
        formatsToSupport: [ 
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.EAN_8
        ],
        aspectRatio: 1.0
      };
      
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        alert("Error al abrir la cámara: " + err);
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('scanner-container').style.display = 'none';
          document.getElementById('btn-scan').style.display = 'block';
          document.getElementById('btn-stop').style.display = 'none';
        }).catch(() => {});
      }
    }

    async function onScanSuccess(decodedText) {
      stopScanner();
      
      const DISCOGS_TOKEN = "CWKqEUOhuHGVWlYnpZzwXXhiGSAqGjBUrbPiYEjM";

      try {
        const response = await fetch(
          `https://api.discogs.com/database/search?barcode=${decodedText}&type=release&token=${DISCOGS_TOKEN}`
        );
        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const album = data.results[0];
          
          pendingVinyl = {
            title: album.title,
            cover: album.cover_image || album.thumb,
            year: album.year || 'Desconocido',
            country: album.country || 'Desconocido',
            label: album.label ? album.label[0] : 'Desconocido',
            genre: album.genre ? album.genre.join(', ') : 'Desconocido'
          };

          document.getElementById('modal-album-title').innerText = pendingVinyl.title;
          document.getElementById('owner-modal').style.display = 'flex';

        } else {
          alert(`Código leído (${decodedText}), pero no se encontró ese vinilo en Discogs.`);
        }
      } catch (error) {
        console.error(error);
        alert("Error al conectar con la base de datos de Discogs.");
      }
    }

    function saveVinylWithOwner(owner) {
      if (pendingVinyl) {
        pendingVinyl.owner = owner;
        collection.unshift(pendingVinyl);
        localStorage.setItem('my_vinyl_collection', JSON.stringify(collection));
        
        pendingVinyl = null;
        document.getElementById('owner-modal').style.display = 'none';
        
        renderCollection();
      }
    }

    function deleteVinyl(index) {
      if (confirm(`¿Seguro que quieres eliminar "${collection[index].title}"?`)) {
        collection.splice(index, 1);
        localStorage.setItem('my_vinyl_collection', JSON.stringify(collection));
        renderCollection();
      }
    }

    function openEditModal(index) {
      editingIndex = index;
      const item = collection[index];

      document.getElementById('edit-title').value = item.title || '';
      document.getElementById('edit-owner').value = item.owner || 'Mío';
      document.getElementById('edit-genre').value = item.genre || '';
      document.getElementById('edit-year').value = item.year || '';
      document.getElementById('edit-country').value = item.country || '';
      document.getElementById('edit-label').value = item.label || '';

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
      editingIndex = null;
    }

    function saveEditedVinyl() {
      if (editingIndex !== null) {
        collection[editingIndex].title = document.getElementById('edit-title').value;
        collection[editingIndex].owner = document.getElementById('edit-owner').value;
        collection[editingIndex].genre = document.getElementById('edit-genre').value;
        collection[editingIndex].year = document.getElementById('edit-year').value;
        collection[editingIndex].country = document.getElementById('edit-country').value;
        collection[editingIndex].label = document.getElementById('edit-label').value;

        localStorage.setItem('my_vinyl_collection', JSON.stringify(collection));
        closeEditModal();
        renderCollection();
      }
    }
  </script>
</body>
</html>
