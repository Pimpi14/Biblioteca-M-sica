<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Colección de Vinilos</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --primary: #1db954;
      --bg: #121212;
      --card-bg: #181818;
      --text: #ffffff;
      --text-sub: #b3b3b3;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 5px; }
    p.subtitle { color: var(--text-sub); margin-top: 0; margin-bottom: 20px; }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
    }
    button {
      flex: 1;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    button.secondary {
      background-color: #333;
    }
    
    #scanner-container {
      width: 100%;
      max-width: 500px;
      display: none;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 800px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      background-color: #282828;
    }
    .card-title {
      font-weight: bold;
      font-size: 14px;
      margin: 8px 0 4px 0;
    }
    .card-year {
      font-size: 12px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <h1>🎵 Colección de Vinilos</h1>
  <p class="subtitle">Escanea y guarda tus discos fácilmente</p>

  <div class="controls">
    <button id="btn-scan" onclick="startScanner()">📷 Escanear Código</button>
    <button id="btn-stop" class="secondary" onclick="stopScanner()" style="display:none;">Cancelar</button>
  </div>

  <div id="scanner-container">
    <div id="reader"></div>
  </div>

  <div class="grid" id="album-grid">
    </div>

  <script>
    let html5QrcodeScanner = null;
    let collection = JSON.parse(localStorage.getItem('my_vinyl_collection')) || [];

    // Cargar la colección guardada al iniciar la página
    document.addEventListener("DOMContentLoaded", renderCollection);

    function renderCollection() {
      const grid = document.getElementById('album-grid');
      grid.innerHTML = '';

      if (collection.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: #b3b3b3;">No hay vinilos guardados todavía.</p>';
        return;
      }

      collection.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.cover || 'https://via.placeholder.com/150?text=Sin+Portada'}" alt="Portada">
          <div class="card-title">${item.title}</div>
          <div class="card-year">${item.year ? item.year : 'Año desconocido'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function startScanner() {
      document.getElementById('scanner-container').style.display = 'block';
      document.getElementById('btn-scan').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'block';

      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 150 } };
      
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        alert("Error al abrir la cámara: " + err);
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('scanner-container').style.display = 'none';
          document.getElementById('btn-scan').style.display = 'block';
          document.getElementById('btn-stop').style.display = 'none';
        }).catch(() => {});
      }
    }

    async function onScanSuccess(decodedText) {
      // Detener escáner tras leer un código
      stopScanner();
      
      // Buscar información en la API pública de Discogs
      try {
        const response = await fetch(`https://api.discogs.com/database/search?barcode=${decodedText}&type=release&token=YOUR_DISCOGS_TOKEN_HERE`);
        
        // Si no tienes token propio, se usa la búsqueda pública general
        const fallbackResponse = await fetch(`https://itunes.apple.com/search?term=${decodedText}&entity=album`);
        const data = await fallbackResponse.json();

        if (data.results && data.results.length > 0) {
          const album = data.results[0];
          const newVinyl = {
            title: `${album.artistName} - ${album.collectionName}`,
            cover: album.artworkUrl100.replace('100x100bb', '300x300bb'),
            year: album.releaseDate ? album.releaseDate.substring(0, 4) : ''
          };

          collection.unshift(newVinyl);
          localStorage.setItem('my_vinyl_collection', JSON.stringify(collection));
          renderCollection();
          alert(`¡Añadido!: ${newVinyl.title}`);
        } else {
          alert("Código leído: " + decodedText + "\nNo se encontró información del álbum en la base de datos.");
        }
      } catch (error) {
        alert("Error al buscar la información del disco.");
      }
    }
  </script>
</body>
</html>
